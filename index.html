<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: #fff; padding: 10px 0; text-align: center; }
        section { padding: 20px; }
        /* Add animations and styles here */
    </style>
    <script>
        // Typing animation script
        document.addEventListener('DOMContentLoaded', function() {
            const element = document.getElementById('typing-animation');
            const text = "Welcome to my portfolio!";
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                }
            }
            type();
        });
    </script>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
    </header>
    <section id="home">
        <h2>Home</h2>
        <div id="typing-animation"></div>
    </section>
    <section id="about">
        <h2>About</h2>
        <p>This is the about section.</p>
    </section>
    <section id="resume">
        <h2>Resume</h2>
        <p>This is the resume section.</p>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <p>This is the contact section.</p>
    </section>
</body>
</html>
