<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabut B K Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to my Portfolio!</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#resume">Resume</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section id="home">
        <h2>Home</h2>
        <p>This is the home section of my portfolio.</p>
    </section>
    <section id="about">
        <h2>About</h2>
        <p>Details about me and my background.</p>
    </section>
    <section id="resume">
        <h2>Resume</h2>
        <p>Information about my skills and experiences.</p>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <p>How to get in touch with me.</p>
    </section>
    <footer>
        <p>&copy; 2026 Sabut B K. All rights reserved.</p>
    </footer>
    <!-- JavaScript for typing animation -->
    <script>
        const text = 'Welcome to my Portfolio!';
        let index = 0;
        function type() {
            if (index < text.length) {
                document.querySelector('h1').innerHTML += text.charAt(index);
                index++;
                setTimeout(type, 100);
            }
        }
        type();
    </script>
</body>
</html>
